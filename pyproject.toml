[project]
name = "rm-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danny Thuering", email = "danny@webmobix.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rm-dashboard = "rm_dashboard:main"
rm-dashboard-seed = "rm_dashboard.data.seed:main"
rm-dashboard-serve = "rm_dashboard.api.serve:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
