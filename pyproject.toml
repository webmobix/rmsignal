[project]
name = "rm-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danny Thuering", email = "danny@webmobix.com" }
]
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]==1.2.2",
    "deepagents==0.7.25",
    "fastapi>=0.143.0",
    "langchain-openai>=1.7.2",
    "langgraph==1.2.15",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rm-dashboard = "rm_dashboard:main"
rm-dashboard-seed = "rm_dashboard.data.seed:main"
rm-dashboard-serve = "rm_dashboard.api.serve:main"
rm-dashboard-analyse = "rm_dashboard.runners.analyse:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.2",
    "pytest>=9.1.1",
]
